system:
  name: GoldTradingSystem
  environment: paper
  max_position_logics: 2

paths:
  data: ./Data
  logs: ./Logs
  backup: ./Backup
  runtime: ./Runtime

trading:
  default_lot: 0.01
  weekend_protection: true
  weekend_flatten_minutes: 30
  overnight_preference: avoid
  max_spread_points: 80
  require_server_sl: true

mt5:
  transport: localhost
  host: 127.0.0.1
  port: 17832
  magic_number: 26092101
  terminal_path: ""
  python_data_adapter: true

atas:
  host: 127.0.0.1
  port: 17831
  require_mbo: false
  stale_seconds: 5

price_mapping:
  rolling_window: 300
  min_samples: 30
  min_correlation: 0.80

ai:
  provider: openai_compatible
  base_url: ""
  model: ""
  timeout_seconds: 15
  retry: 1
  max_tokens: 2000
  temperature: 0.1
  proxy: ""
  secrets_file: ./Config/secrets.local
  minimum_interval_seconds: 15
  min_confidence: 0.60

history:
  rolling_days: 90

ui:
  host: 127.0.0.1
  port: 17840
