<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GoldTradingSystem 驾驶舱</title>
<style>
body{font-family:Segoe UI,Microsoft YaHei,sans-serif;background:#101318;color:#e9eef6;margin:0}header{padding:16px 22px;background:#171b22;font-size:22px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;padding:12px}.card{background:#171b22;border:1px solid #2a303a;border-radius:8px;padding:14px}.title{font-weight:700;margin-bottom:10px}.row{display:flex;justify-content:space-between;gap:16px;padding:4px 0}.ok{color:#55d187}.warn{color:#f2c14e}.bad{color:#ff6b6b}.muted{color:#9aa6b2}pre{white-space:pre-wrap;word-break:break-word;margin:0}</style></head>
<body><header>GoldTradingSystem 中文驾驶舱</header><div class="grid" id="grid"></div>
<script>
function cls(v){return ['HEALTHY','CONNECTED','可执行','LONG','UP','TRUE_BREAKOUT'].includes(v)?'ok':['OFFLINE','禁止交易','已失效','FALSE_BREAKOUT'].includes(v)?'bad':'warn'}
function card(t,html){return `<section class="card"><div class="title">${t}</div>${html}</section>`}
function j(x){return JSON.stringify(x,null,2)}
async function refresh(){try{const s=await (await fetch('/api/state')).json();let h='';
h+=card('系统状态',Object.entries(s.system||{}).map(([k,v])=>`<div class="row"><span>${k}</span><b class="${cls(v)}">${v}</b></div>`).join(''));
h+=card('当前市场',`<pre>${j(s.market)}</pre>`);
h+=card('市场状态',`<div class="row"><span>状态</span><b>${s.regime}</b></div><div class="row"><span>优先方向</span><b>${s.bias}</b></div>`);
h+=card('多周期强支撑 / 强阻力',`<pre>支撑\n${j(s.supports)}\n\n阻力\n${j(s.resistances)}</pre>`);
h+=card('前三潜在交易区',`<pre>${j(s.zones)}</pre>`);
h+=card('真假突破',`<pre>${j(s.breakout)}</pre>`);
h+=card('三种交易模式',`<pre>${j(s.trade_modes)}</pre>`);
h+=card('ATAS综合判断',`<pre>${s.orderflow_assessment}</pre>`);
h+=card('LONG PLAN',`<pre>${j(s.long_plan)}</pre>`);h+=card('SHORT PLAN',`<pre>${j(s.short_plan)}</pre>`);
h+=card('为什么没有开仓',`<pre>${(s.why_no_trade||[]).join('\n')}</pre>`);h+=card('当前持仓',`<pre>${j(s.positions)}</pre>`);document.getElementById('grid').innerHTML=h}catch(e){document.getElementById('grid').innerHTML=card('Dashboard','等待 Python Engine...')}}
refresh();setInterval(refresh,1000);
</script></body></html>
