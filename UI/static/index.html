<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GoldTradingSystem 驾驶舱</title>
<style>
body{font-family:Segoe UI,Microsoft YaHei,sans-serif;background:#101318;color:#e9eef6;margin:0}header{padding:16px 22px;background:#171b22;font-size:22px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;padding:12px}.card{background:#171b22;border:1px solid #2a303a;border-radius:8px;padding:14px}.title{font-weight:700;margin-bottom:10px}.row{display:flex;justify-content:space-between;padding:4px 0}.ok{color:#55d187}.warn{color:#f2c14e}.bad{color:#ff6b6b}.muted{color:#9aa6b2}pre{white-space:pre-wrap;word-break:break-word}</style></head>
<body><header>GoldTradingSystem 中文驾驶舱</header><div class="grid" id="grid"></div>
<script>
function cls(v){return ['HEALTHY','可执行','LONG','UP'].includes(v)?'ok':['OFFLINE','禁止交易','失效'].includes(v)?'bad':'warn'}
function card(t,html){return `<section class="card"><div class="title">${t}</div>${html}</section>`}
async function refresh(){const s=await (await fetch('/api/state')).json();let h='';
h+=card('系统状态',Object.entries(s.system).map(([k,v])=>`<div class="row"><span>${k}</span><b class="${cls(v)}">${v}</b></div>`).join(''));
h+=card('当前市场',`<pre>${JSON.stringify(s.market,null,2)}</pre>`);
h+=card('市场状态',`<div class="row"><span>状态</span><b>${s.regime}</b></div><div class="row"><span>优先方向</span><b>${s.bias}</b></div>`);
h+=card('强支撑 / 强阻力',`<pre>支撑 ${JSON.stringify(s.supports)}\n阻力 ${JSON.stringify(s.resistances)}</pre>`);
h+=card('潜在交易区',`<pre>${JSON.stringify(s.zones,null,2)}</pre>`);
h+=card('ATAS综合判断',`<pre>${s.orderflow_assessment}</pre>`);
h+=card('LONG PLAN',`<pre>${JSON.stringify(s.long_plan,null,2)}</pre>`);h+=card('SHORT PLAN',`<pre>${JSON.stringify(s.short_plan,null,2)}</pre>`);
h+=card('为什么没有开仓',`<pre>${(s.why_no_trade||[]).join('\n')}</pre>`);h+=card('当前持仓',`<pre>${JSON.stringify(s.positions,null,2)}</pre>`);document.getElementById('grid').innerHTML=h}
refresh();setInterval(refresh,1000);
</script></body></html>
