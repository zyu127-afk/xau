name: ATAS bridge core build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build ATAS/GoldTradingDataBridge/GoldTradingDataBridge.csproj --configuration Release
      - run: dotnet run --project ATAS/GoldTradingDataBridge.Smoke/GoldTradingDataBridge.Smoke.csproj --configuration Release
